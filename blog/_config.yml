title: "Srki Dex"
description: "Web dizajn, SEO i projekti."

url: "https://srki-dex.github.io"
baseurl: "/blog"

lang: "sr"
timezone: "Europe/Belgrade"

author:
  name: "Srđan Cvetković"
  url: "https://srki-dex.github.io/"

# Markdown
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  toc_levels: 1..3

# Post URLs
permalink: /:categories/:title/

# Plugins
plugins:
  - jekyll-paginate

# Pagination
paginate: 12
paginate_path: "/page:num/"

# Default values
defaults:

  # Blog posts
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Srđan Cvetković"

# Files excluded from the generated site
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor