name: Build and Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: './blog'

      - name: Prepare site
        run: |
          mkdir -p _site
          
          # Copy existing website
          rsync -av \
            --exclude='blog' \
            --exclude='_site' \
            --exclude='.git' \
            --exclude='.github' \
            ./ ./_site/

      - name: Build Jekyll blog
        working-directory: ./blog
        run: |
          bundle install
          bundle exec jekyll build \
            --destination ../_site/blog \
            --baseurl "/blog"
        env:
          JEKYLL_ENV: production

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
